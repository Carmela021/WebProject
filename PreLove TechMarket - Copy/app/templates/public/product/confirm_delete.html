{% extends 'base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/crud.css') }}">
{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">

        <div class="delete-icon">🗑️</div>
        <h1 class="delete-title">Delete Product</h1>
        <p class="form-subtitle">This action cannot be undone</p>
        <div class="form-divider"></div>

        <p class="delete-message">Are you sure you want to delete</p>
        <p class="delete-product-name">"{{ product.name }}"?</p>

        <form method="POST" action="{{ url_for('product.delete_product', product_id=product.id) }}">
            <div class="form-actions">
                <button type="submit" class="btn-delete-confirm">
                    🗑️ Yes, Delete
                </button>
                <a href="{{ url_for('product.shop') }}" class="btn-cancel">Cancel</a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
